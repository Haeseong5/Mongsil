[versions]
# SDK Versions
espressoCore = "3.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
reviewKtx = "2.0.2"


# Kotlin
kotlin = "2.2.0"
kotlinSerialization = "1.9.0"
kotlinCoroutines = "1.10.2"
navigationVersion ="2.9.6"
# Android Core
agp = "8.13.1"
androidxCore = "1.17.0"
androidMaterial = "1.13.0"
appcompat = "1.7.1"
annotation = "1.9.1"

# Lifecycle
lifecycle = "2.9.4"

# Room
room = "2.8.3"

# Navigation
navigation = "2.9.6"

# Hilt
hilt = "2.57.2"

# Compose
composeBom = "2025.11.00"
composeCompiler = "1.5.14"
